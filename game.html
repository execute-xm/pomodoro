<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>水豚解压馆 · 投喂与烦恼粉碎</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at center, #261D18 0%, #120E0C 100%);
      color: #E6D5C3;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* 顶部控制与亲密度 */
    .top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .heart-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 138, 128, 0.3);
      color: #FF8A80;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
    }
    .pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #D7CCC8;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: 0.2s;
    }
    .pill-btn.active {
      background: #FFA726;
      color: #211510;
      font-weight: bold;
      border-color: #FFA726;
    }

    /* 烦恼粉碎输入条 */
    .crush-bar {
      width: 100%;
      max-width: 380px;
      display: flex;
      gap: 6px;
      margin-top: 4px;
      background: rgba(0,0,0,0.3);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .crush-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #FFF;
      font-size: 13px;
      padding: 0 8px;
    }
    .crush-input::placeholder { color: #8D6E63; }
    .crush-btn {
      background: #E53935;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 计数面板 */
    .stats-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .counter-title {
      font-size: 12px;
      letter-spacing: 2px;
      color: #A1887F;
    }
    .main-counter {
      font-size: 46px;
      font-weight: 900;
      color: #FFB74D;
      text-shadow: 0 0 25px rgba(255, 183, 77, 0.45);
      font-variant-numeric: tabular-nums;
    }
    .combo-badge {
      font-size: 12px;
      color: #FFE082;
      background: rgba(255, 179, 0, 0.15);
      border: 1px solid rgba(255, 179, 0, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    /* 主舞台 */
    .stage-wrapper {
      position: relative;
      width: 300px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .buddha-halo {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(255, 215, 0, 0.3) 0deg, transparent 40deg, rgba(255, 215, 0, 0.3) 90deg, transparent 130deg, rgba(255, 215, 0, 0.3) 180deg, transparent 220deg, rgba(255, 215, 0, 0.3) 270deg, transparent 310deg, rgba(255, 215, 0, 0.3) 360deg);
      opacity: 0;
      transition: opacity 0.5s;
      animation: spinHalo 10s linear infinite;
      pointer-events: none;
      filter: blur(2px);
    }
    @keyframes spinHalo {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .stage-wrapper.high-combo .buddha-halo { opacity: 1; }

    .capy-svg {
      width: 200px;
      height: 180px;
      transform-origin: center bottom;
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
    }
    .stage-wrapper.hit .capy-svg {
      transform: scale(1.18, 0.74) translateY(22px);
    }
    .stage-wrapper.chewing .capy-svg {
      animation: chewAnim 0.35s ease infinite alternate;
    }
    @keyframes chewAnim {
      0% { transform: scale(1, 1); }
      100% { transform: scale(1.06, 0.94) translateY(4px); }
    }

    /* 飘字与粒子 */
    .fly-text {
      position: absolute;
      font-size: 19px;
      font-weight: 800;
      pointer-events: none;
      animation: floatUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 50;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { opacity: 1; transform: translateY(-50px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-95px) scale(0.95); }
    }

    /* 底部投喂食物坞 (Food Dock) */
    .feed-dock {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 183, 77, 0.25);
    }
    .food-btn {
      font-size: 24px;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: transform 0.15s;
      position: relative;
    }
    .food-btn:active {
      transform: scale(1.3) translateY(-6px);
    }

    /* 音效切换条 */
    .bottom-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin-bottom: 4px;
    }
    .sound-row {
      display: flex;
      gap: 8px;
      font-size: 12px;
    }
    .sound-chip {
      background: #1D1614;
      border: 1px solid #3E2D27;
      padding: 4px 10px;
      border-radius: 14px;
      color: #A1887F;
      cursor: pointer;
    }
    .sound-chip.active {
      border-color: #FFA726;
      color: #FFA726;
    }

    /* 碎纸碎片动画 */
    .shred-piece {
      position: absolute;
      pointer-events: none;
      font-weight: bold;
      animation: shredFall 1s ease-out forwards;
      z-index: 100;
    }
    @keyframes shredFall {
      0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); }
    }
  </style>
</head>
<body>

  <!-- 顶部控制条 -->
  <div class="top-bar">
    <div class="heart-pill">
      <span>❤️ 亲密度</span>
      <span id="affinity-val">Lv.1 (0)</span>
    </div>
    <div class="pill-btn" id="auto-btn" onclick="toggleAutoTap()">
      <span>⚙️ 自动敲: 关</span>
    </div>
  </div>

  <!-- 烦恼粉碎机输入栏 -->
  <div class="crush-bar">
    <input type="text" id="worry-input" class="crush-input" placeholder="输入此刻烦恼（如：工作太累、赶ddl）..." maxlength="20" onkeydown="if(event.key==='Enter')shredWorry()">
    <button class="crush-btn" onclick="shredWorry()">💥 彻底粉碎</button>
  </div>

  <!-- 计数面板 -->
  <div class="stats-panel">
    <div class="counter-title">今日累积功德</div>
    <div class="main-counter" id="total-val">0</div>
    <div class="combo-badge" id="combo-pill">连击 x0 佛光初现</div>
  </div>

  <!-- 主舞台 -->
  <div class="stage-wrapper" id="stage">
    <div class="buddha-halo"></div>

    <svg class="capy-svg" id="capy-actor" viewBox="0 0 120 110">
      <ellipse cx="32" cy="38" rx="5" ry="8" fill="#7A5445" stroke="#4E342E" stroke-width="1.8"/>
      <ellipse cx="88" cy="38" rx="5" ry="8" fill="#7A5445" stroke="#4E342E" stroke-width="1.8"/>
      <path d="M 34,34 Q 60,30 86,34 Q 102,46 102,74 Q 94,92 60,92 Q 26,92 18,74 Q 18,46 34,34 Z" 
            fill="#9C6B53" stroke="#4E342E" stroke-width="2.5"/>
      <ellipse cx="60" cy="70" rx="34" ry="16" fill="#B58169" stroke="#4E342E" stroke-width="1.8"/>
      <line x1="36" y1="56" x2="48" y2="56" stroke="#2D1E18" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="56" x2="84" y2="56" stroke="#2D1E18" stroke-width="3" stroke-linecap="round"/>
      
      <ellipse cx="55" cy="69" rx="2.5" ry="3.5" fill="#3E2723"/>
      <ellipse cx="65" cy="69" rx="2.5" ry="3.5" fill="#3E2723"/>
      <line x1="60" y1="73" x2="60" y2="79" stroke="#3E2723" stroke-width="1.8"/>
      <ellipse cx="28" cy="66" rx="5" ry="4" fill="#E57373" opacity="0.85"/>
      <ellipse cx="92" cy="66" rx="5" ry="4" fill="#E57373" opacity="0.85"/>

      <!-- 橘子 -->
      <g>
        <circle cx="60" cy="18" r="11" fill="#FFA000" stroke="#E65100" stroke-width="1.5"/>
        <polygon points="60,9 55,2 62,5" fill="#7CB342" stroke="#558B2F" stroke-width="1"/>
      </g>
    </svg>
  </div>

  <!-- 投喂食物坞 -->
  <div style="font-size:11px; color:#A1887F;">点击食物投喂水豚增加好感度：</div>
  <div class="feed-dock">
    <button class="food-btn" onclick="feedCapy('🍊', '橘子 +1 甜滋滋', 5)">🍊</button>
    <button class="food-btn" onclick="feedCapy('🌿', '青草 +1 嚼嚼', 3)">🌿</button>
    <button class="food-btn" onclick="feedCapy('🍜', '温泉拉面 +1 满足', 10)">🍜</button>
    <button class="food-btn" onclick="feedCapy('🍉', '大西瓜 +1 畅爽', 15)">🍉</button>
  </div>

  <!-- 底部音效切换 -->
  <div class="bottom-controls">
    <div class="sound-row">
      <div class="sound-chip active" onclick="setSound('muyu', this)">🪵 经典木鱼</div>
      <div class="sound-chip" onclick="setSound('pop', this)">🫧 捏捏气泡</div>
      <div class="sound-chip" onclick="setSound('water', this)">💧 空灵水滴</div>
    </div>
  </div>

<script>
  let totalScore = parseInt(localStorage.getItem("capy_interact_merit") || "0");
  let affinityScore = parseInt(localStorage.getItem("capy_affinity") || "0");
  let currentSound = "muyu";
  let combo = 0;
  let comboTimer = null;
  let autoTimer = null;
  let isAuto = false;

  const words = [
    { text: "心平气和 +1 🍃", color: "#81C784" },
    { text: "功德 +1 🪵", color: "#FFD54F" },
    { text: "焦虑 -99 🫧", color: "#FF8A65" },
    { text: "水豚保佑 🍊", color: "#FFB74D" },
    { text: "精神稳定 +1 ✨", color: "#4DD0E1" }
  ];

  document.getElementById("total-val").innerText = totalScore;
  updateAffinityDisplay();

  /* --- Web Audio 声音合成 --- */
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;

  function ensureAudioUnlocked() {
    if (!actx) actx = new AudioCtx();
    if (actx.state === 'suspended') actx.resume();
  }

  window.addEventListener('click', ensureAudioUnlocked, { once: true });
  window.addEventListener('touchstart', ensureAudioUnlocked, { once: true });

  function playTone(type) {
    ensureAudioUnlocked();
    if (!actx) return;
    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();

    if (type === 'muyu') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(650, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
      gain.gain.setValueAtTime(1.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'pop') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(850, now + 0.05);
      gain.gain.setValueAtTime(1.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'water') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1300, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.18);
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.start(now); osc.stop(now + 0.23);
    } else if (type === 'crunch') {
      // 投喂咀嚼音
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.11);
    } else if (type === 'boom') {
      // 粉碎低音炮
      osc.type = 'square';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
      gain.gain.setValueAtTime(1.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now); osc.stop(now + 0.36);
    }

    osc.connect(gain);
    gain.connect(actx.destination);
  }

  /* --- 敲击木鱼交互 --- */
  const stage = document.getElementById("stage");

  function executeHit() {
    ensureAudioUnlocked();
    totalScore++;
    document.getElementById("total-val").innerText = totalScore;
    localStorage.setItem("capy_interact_merit", totalScore);

    playTone(currentSound);
    if (navigator.vibrate) navigator.vibrate(12);

    stage.classList.add("hit");
    setTimeout(() => stage.classList.remove("hit"), 80);

    combo++;
    const comboEl = document.getElementById("combo-pill");
    comboEl.innerText = `连击 x${combo} ${combo >= 10 ? '✨ 佛光普照' : ''}`;
    comboEl.style.opacity = "1";
    if (combo >= 10) stage.classList.add("high-combo");

    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => {
      combo = 0;
      comboEl.style.opacity = "0";
      stage.classList.remove("high-combo");
    }, 1400);

    spawnText();
  }

  function spawnText(customText, customColor) {
    const item = words[Math.floor(Math.random() * words.length)];
    const span = document.createElement("span");
    span.className = "fly-text";
    span.innerText = customText || item.text;
    span.style.color = customColor || item.color;
    const offset = (Math.random() - 0.5) * 80;
    span.style.left = `${150 + offset - 40}px`;
    span.style.top = "36px";
    stage.appendChild(span);
    setTimeout(() => span.remove(), 850);
  }

  stage.addEventListener("pointerdown", executeHit);

  /* --- 互动机制 1：投喂水豚 --- */
  function feedCapy(icon, note, heartAdd) {
    ensureAudioUnlocked();
    playTone('crunch');
    if (navigator.vibrate) navigator.vibrate([15, 30, 15]);

    affinityScore += heartAdd;
    localStorage.setItem("capy_affinity", affinityScore);
    updateAffinityDisplay();

    // 咀嚼动画
    stage.classList.add("chewing");
    setTimeout(() => stage.classList.remove("chewing"), 700);

    spawnText(`${icon} ${note}`, "#FF8A80");
  }

  function updateAffinityDisplay() {
    const level = Math.floor(affinityScore / 50) + 1;
    document.getElementById("affinity-val").innerText = `Lv.${level} (${affinityScore})`;
  }

  /* --- 互动机制 2：烦恼粉碎机 --- */
  function shredWorry() {
    const input = document.getElementById("worry-input");
    const val = input.value.trim();
    if (!val) return;

    ensureAudioUnlocked();
    playTone('boom');
    if (navigator.vibrate) navigator.vibrate([40, 80, 40]);

    // 产生爆破粉碎文字碎片
    const chars = val.split("");
    const stageRect = stage.getBoundingClientRect();

    chars.forEach((c) => {
      const piece = document.createElement("div");
      piece.className = "shred-piece";
      piece.innerText = c;
      piece.style.left = `${stageRect.width / 2}px`;
      piece.style.top = `${stageRect.height / 2}px`;
      piece.style.color = "#FF5252";
      piece.style.fontSize = `${16 + Math.random() * 12}px`;

      const dx = (Math.random() - 0.5) * 260 + "px";
      const dy = (Math.random() - 0.5) * 220 + "px";
      const rot = (Math.random() - 0.5) * 720 + "deg";
      piece.style.setProperty("--dx", dx);
      piece.style.setProperty("--dy", dy);
      piece.style.setProperty("--rot", rot);

      stage.appendChild(piece);
      setTimeout(() => piece.remove(), 1000);
    });

    spawnText(`🔥 “${val}” 已被粉碎！`, "#FF5252");
    input.value = "";
  }

  /* --- 自动敲与音效切换 --- */
  function toggleAutoTap() {
    ensureAudioUnlocked();
    isAuto = !isAuto;
    const btn = document.getElementById("auto-btn");
    if (isAuto) {
      btn.innerHTML = "<span>⚙️ 自动敲: 开</span>";
      btn.classList.add("active");
      autoTimer = setInterval(executeHit, 800);
    } else {
      btn.innerHTML = "<span>⚙️ 自动敲: 关</span>";
      btn.classList.remove("active");
      clearInterval(autoTimer);
    }
  }

  function setSound(type, el) {
    ensureAudioUnlocked();
    currentSound = type;
    document.querySelectorAll(".sound-chip").forEach(c => c.classList.remove("active"));
    el.classList.add("active");
    playTone(type);
  }
</script>
</body>
</html>
