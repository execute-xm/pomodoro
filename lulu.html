<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>水豚噜噜的松弛清单</title>
  
  <!-- iPhone 原生应用体验 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="噜噜清单">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/capybara.png">

  <style>
    :root {
      /* 水豚大地奶咖色调 */
      --bg-warm: #f7f1e5;
      --card-bg: rgba(255, 253, 249, 0.9);
      --card-border: #ede1d1;
      --capy-brown: #795548;
      --capy-dark: #4e342e;
      --capy-orange: #ff8f00;
      --capy-orange-soft: #ffe0b2;
      --leaf-green: #689f38;
      --leaf-soft: #dcedc8;
      --spa-blue: #0288d1;
      --spa-soft: #b3e5fc;
      --text-main: #3e2723;
      --text-sub: #8d6e63;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "SF Pro Rounded", sans-serif;
    }

    body {
      background-color: var(--bg-warm);
      background-image: 
        radial-gradient(#e6d5be 1.2px, transparent 1.2px),
        radial-gradient(#e6d5be 1.2px, var(--bg-warm) 1.2px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: var(--text-main);
      min-height: 100vh;
      padding: env(safe-area-inset-top, 24px) 20px calc(env(safe-area-inset-bottom, 24px) + 24px);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    /* 顶部标题栏 */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0 20px;
    }
    .header-text h1 {
      font-size: 25px;
      font-weight: 800;
      color: var(--capy-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .date-pill {
      font-size: 13px;
      font-weight: 600;
      color: var(--capy-orange);
      margin-top: 4px;
    }
    .capy-avatar {
      font-size: 40px;
      line-height: 1;
      filter: drop-shadow(0 6px 8px rgba(121, 85, 72, 0.2));
      animation: capyFloat 3.5s ease-in-out infinite alternate;
      user-select: none;
    }
    @keyframes capyFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-5px) rotate(2deg); }
    }

    /* 泡澡进度看板 */
    .dashboard {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 26px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 24px rgba(121, 85, 72, 0.08);
    }
    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .dash-top .label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .dash-top .percent {
      font-size: 24px;
      font-weight: 800;
      color: var(--capy-orange);
    }
    .progress-track {
      width: 100%;
      height: 16px;
      background: #ece0cf;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 12px;
      padding: 2px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffa726, #fb8c00);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stats-footer {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }

    /* 输入区 */
    .input-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(121, 85, 72, 0.06);
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border-radius: 16px;
      padding: 6px 8px 6px 16px;
      border: 2px solid #e0d2c0;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: var(--capy-orange);
    }
    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--capy-dark);
      font-size: 15px;
      outline: none;
      font-weight: 500;
    }
    input[type="text"]::placeholder {
      color: #bcaaa4;
    }
    .btn-submit {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
      border: none;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(245, 124, 0, 0.35);
      transition: transform 0.12s ease;
    }
    .btn-submit:active {
      transform: scale(0.92);
    }

    /* 豚门标签 */
    .tag-selector {
      display: flex;
      gap: 8px;
    }
    .tag-chip {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      border: 1.5px solid transparent;
      background: #f0e4d4;
      color: var(--capy-brown);
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-chip.active {
      background: #ffffff;
      border-color: var(--capy-orange);
      color: var(--capy-orange);
      box-shadow: 0 3px 8px rgba(255, 143, 0, 0.2);
      transform: translateY(-1px);
    }

    /* 筛选状态 */
    .tabs {
      display: flex;
      background: #ebdccb;
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      color: var(--capy-brown);
      border: none;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: #ffffff;
      color: var(--capy-dark);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
    }

    /* 计划卡片 */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .task-item {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 5px 14px rgba(121, 85, 72, 0.05);
      animation: slideIn 0.25s ease-out;
      transition: all 0.2s;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    /* 水豚橘子复选框 */
    .checkbox {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px dashed #bcaaa4;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      background: #ffffff;
      font-size: 16px;
      transition: all 0.2s;
    }
    .task-item.done .checkbox {
      border: none;
      background: transparent;
      transform: scale(1.15);
    }

    .task-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--capy-dark);
      line-height: 1.4;
      transition: all 0.2s;
    }
    .task-item.done .task-title {
      text-decoration: line-through;
      color: #bcaaa4;
    }
    .category-badge {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .category-头顶橘子 { background: var(--capy-orange-soft); color: var(--capy-orange); }
    .category-温泉发呆 { background: var(--spa-soft); color: var(--spa-blue); }
    .category-嚼嚼草叶 { background: var(--leaf-soft); color: var(--leaf-green); }

    .btn-delete {
      background: transparent;
      border: none;
      color: #bcaaa4;
      cursor: pointer;
      padding: 8px;
      font-size: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .btn-delete:active {
      color: #d32f2f;
    }

    /* 空状态 */
    .empty-placeholder {
      text-align: center;
      padding: 40px 0;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 顶部状态栏 -->
    <header class="app-header">
      <div class="header-text">
        <div class="date-pill" id="currentDate">TODAY</div>
        <h1>水豚噜噜清单</h1>
      </div>
      <div class="capy-avatar">🍊🦫</div>
    </header>

    <!-- 泡澡能量进度看板 -->
    <section class="dashboard">
      <div class="dash-top">
        <span class="label">♨️ 噜噜泡澡完成度</span>
        <span class="percent" id="percentNum">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="stats-footer">
        <span id="remainCount">待办: 0 件</span>
        <span id="finishCount">已松弛搞定: 0 件</span>
      </div>
    </section>

    <!-- 气泡输入卡片 -->
    <section class="input-card">
      <div class="input-wrapper">
        <input type="text" id="taskInput" placeholder="慢悠悠记下一件事..." maxlength="35">
        <button class="btn-submit" id="addBtn">＋</button>
      </div>
      <div class="tag-selector" id="tagGroup">
        <div class="tag-chip active" data-cat="头顶橘子">🍊 头顶橘子</div>
        <div class="tag-chip" data-cat="温泉发呆">♨️ 温泉发呆</div>
        <div class="tag-chip" data-cat="嚼嚼草叶">🌿 嚼嚼草叶</div>
      </div>
    </section>

    <!-- 筛选栏 -->
    <nav class="tabs">
      <button class="tab active" data-filter="all">全部计划</button>
      <button class="tab" data-filter="active">未完成</button>
      <button class="tab" data-filter="done">已搞定</button>
    </nav>

    <!-- 计划列表 -->
    <main class="task-list" id="taskList"></main>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('capy_tasks') || '[]');
    let currentCategory = '头顶橘子';
    let currentFilter = 'all';

    // 格式化今日日期
    const dateEl = document.getElementById('currentDate');
    const now = new Date();
    dateEl.textContent = `${now.getMonth() + 1}月${now.getDate()}日 · 情绪稳定的一天`;

    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const percentNum = document.getElementById('percentNum');
    const progressBar = document.getElementById('progressBar');
    const remainCount = document.getElementById('remainCount');
    const finishCount = document.getElementById('finishCount');
    const tagChips = document.querySelectorAll('.tag-chip');
    const tabs = document.querySelectorAll('.tab');

    // 标签切换
    tagChips.forEach(chip => {
      chip.addEventListener('click', () => {
        tagChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentCategory = chip.dataset.cat;
      });
    });

    // 状态过滤切换
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        render();
      });
    });

    function save() {
      localStorage.setItem('capy_tasks', JSON.stringify(tasks));
      render();
    }

    function render() {
      const filtered = tasks.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'done') return t.completed;
        return true;
      });

      if (filtered.length === 0) {
        taskList.innerHTML = `
          <div class="empty-placeholder">
            ${currentFilter === 'done' ? '还没有搞定的计划呢～' : '空空如也～<br>像水豚一样放空，或者记下今天的第一件事 🍊'}
          </div>`;
      } else {
        taskList.innerHTML = filtered.map(t => `
          <div class="task-item ${t.completed ? 'done' : ''}">
            <div class="task-left">
              <div class="checkbox" onclick="toggleTask(${t.id})">
                ${t.completed ? '🍊' : ''}
              </div>
              <div class="task-content">
                <span class="category-badge category-${t.category}">${t.category}</span>
                <span class="task-title">${t.title}</span>
              </div>
            </div>
            <button class="btn-delete" onclick="deleteTask(${t.id})">✕</button>
          </div>
        `).join('');
      }

      // 计算泡澡进度
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      percentNum.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;
      remainCount.textContent = `待办: ${total - completed} 件`;
      finishCount.textContent = `已松弛搞定: ${completed} 件`;
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: Date.now(),
        title: text,
        category: currentCategory,
        completed: false
      });

      taskInput.value = '';
      save();
    }

    window.toggleTask = function(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      save();
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
    };

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    // 初始渲染
    render();
  </script>
</body>
</html>
