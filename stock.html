<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>股票走势与深度归因看板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0E1117;
      color: #E6EDF3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    /* 搜索栏与输入 */
    .search-box {
      display: flex;
      gap: 8px;
      background: #161B22;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #30363D;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-size: 15px;
    }
    .search-input::placeholder { color: #6E7681; }
    .search-btn {
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    /* 核心股票报价卡片 */
    .hero-card {
      background: #161B22;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #30363D;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hero-name {
      font-size: 20px;
      font-weight: bold;
      color: #FFFFFF;
    }
    .hero-code {
      font-size: 13px;
      color: #8B949E;
      margin-left: 6px;
    }
    .hero-price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .hero-price {
      font-size: 34px;
      font-weight: bold;
      letter-spacing: -1px;
    }
    .hero-change {
      font-size: 16px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
    }

    /* 走势图切换与展示 */
    .chart-panel {
      background: #0D1117;
      border-radius: 10px;
      padding: 8px;
      border: 1px solid #21262D;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chart-tabs {
      display: flex;
      gap: 6px;
    }
    .chart-tab {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
      background: #21262D;
      color: #8B949E;
      cursor: pointer;
      font-weight: 500;
    }
    .chart-tab.active {
      background: #388BFD;
      color: white;
    }
    .chart-img-wrap {
      width: 100%;
      height: 200px;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chart-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* 涨跌深度归因诊断卡片 */
    .analysis-card {
      background: #161B22;
      border-radius: 12px;
      padding: 14px 16px;
      border: 1px solid #30363D;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #8B949E;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .diagnosis-box {
      background: #0D1117;
      border-radius: 8px;
      padding: 12px;
      border-left: 4px solid #388BFD;
      font-size: 13px;
      line-height: 1.6;
      color: #C9D1D9;
    }
    .diagnosis-title {
      font-weight: bold;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    /* 盘面量价指标格 */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metric-cell {
      background: #0D1117;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #21262D;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-cell span:first-child { font-size: 11px; color: #8B949E; }
    .metric-cell span:last-child { font-size: 13px; font-weight: bold; color: #E6EDF3; }

    /* 异动资讯快速入口 */
    .news-links {
      display: flex;
      gap: 8px;
    }
    .news-btn {
      flex: 1;
      text-align: center;
      background: #21262D;
      color: #58A6FF;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      padding: 8px 0;
      border-radius: 6px;
      border: 1px solid #30363D;
      transition: 0.2s;
    }
    .news-btn:hover { background: #30363D; }

    /* 红涨绿跌标准配色 */
    .up { color: #F85149 !important; }
    .up-bg { background: rgba(248, 81, 73, 0.15); color: #F85149; }
    .down { color: #3FB950 !important; }
    .down-bg { background: rgba(63, 185, 80, 0.15); color: #3FB950; }
    .flat { color: #8B949E !important; }
    .flat-bg { background: #21262D; color: #8B949E; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 输入搜索 -->
  <div class="search-box">
    <input type="text" id="stock-input" class="search-input" placeholder="输入股票代码 (如 600519、000001、00700)..." onkeydown="if(event.key==='Enter')loadStock()">
    <button class="search-btn" onclick="loadStock()">深度查看</button>
  </div>

  <!-- 主体行情卡片 -->
  <div class="hero-card">
    <div class="hero-header">
      <div>
        <span class="hero-name" id="quote-name">加载中...</span>
        <span class="hero-code" id="quote-code">SH600519</span>
      </div>
      <span style="font-size: 12px; color: #8B949E;" id="quote-time">实时更新</span>
    </div>

    <div class="hero-price-row">
      <div class="hero-price" id="quote-price">--</div>
      <div class="hero-change" id="quote-change">--%</div>
    </div>

    <!-- 走势图切换面板 -->
    <div class="chart-panel">
      <div class="chart-tabs">
        <div class="chart-tab active" onclick="switchChart('min', this)">分时图 (今日走势)</div>
        <div class="chart-tab" onclick="switchChart('daily', this)">日 K 线</div>
        <div class="chart-tab" onclick="switchChart('weekly', this)">周 K 线</div>
      </div>
      <div class="chart-img-wrap">
        <img id="stock-chart" src="" alt="股票走势图">
      </div>
    </div>
  </div>

  <!-- 为什么涨跌：量价异动深度诊断 -->
  <div class="analysis-card">
    <div class="section-title">📊 盘面深度归因与动能解析</div>
    
    <!-- 智能研判文案 -->
    <div class="diagnosis-box">
      <div class="diagnosis-title" id="diag-title">正在解读盘面动向...</div>
      <div id="diag-content">正在结合换手率、量比与日内分时波动计算主力动能。</div>
    </div>

    <!-- 盘面量价指标 -->
    <div class="metric-grid">
      <div class="metric-cell">
        <span>今日最高</span>
        <span id="m-high">--</span>
      </div>
      <div class="metric-cell">
        <span>今日最低</span>
        <span id="m-low">--</span>
      </div>
      <div class="metric-cell">
        <span>振幅 (波动)</span>
        <span id="m-amp">--%</span>
      </div>
      <div class="metric-cell">
        <span>成交额</span>
        <span id="m-amount">--</span>
      </div>
      <div class="metric-cell">
        <span>换手率</span>
        <span id="m-turnover">--%</span>
      </div>
      <div class="metric-cell">
        <span>市盈率 (TTM)</span>
        <span id="m-pe">--</span>
      </div>
    </div>

    <!-- 实时新闻与涨跌异动直达入口 -->
    <div class="section-title" style="margin-top: 4px;">🔍 查阅官方公告、消息面与异动原因</div>
    <div class="news-links">
      <a id="link-em" class="news-btn" target="_blank" href="#">东方财富 · 个股异动 & 资讯 ↗</a>
      <a id="link-ths" class="news-btn" target="_blank" href="#">同花顺 · 资金流向诊断 ↗</a>
    </div>
  </div>
</div>

<script>
  let currentStock = "sh600519"; // 默认贵州茅台
  let currentChartType = "min";   // 默认分时图
  let refreshTimer = null;

  function formatStockCode(raw) {
    let code = raw.trim().toLowerCase();
    if (code.startsWith("sh") || code.startsWith("sz") || code.startsWith("hk")) return code;
    if (code.length === 5) return "hk" + code;
    if (code.startsWith("6") || code.startsWith("9") || code.startsWith("5")) return "sh" + code;
    return "sz" + code;
  }

  function getPureCode(formatted) {
    return formatted.replace(/^(sh|sz|hk)/, "");
  }

  function switchChart(type, el) {
    currentChartType = type;
    document.querySelectorAll(".chart-tab").forEach(t => t.classList.remove("active"));
    el.classList.add("active");
    updateChartImage();
  }

  function updateChartImage() {
    const chartImg = document.getElementById("stock-chart");
    // 新浪专业走势图接口：min=分时, daily=日K, weekly=周K
    chartImg.src = `https://image.sinajs.cn/newchart/${currentChartType}/n/${currentStock}.gif?_=${Date.now()}`;
  }

  function loadStock() {
    const inputVal = document.getElementById("stock-input").value.trim();
    if (inputVal) {
      currentStock = formatStockCode(inputVal);
    }
    fetchQuoteData();
    updateChartImage();
  }

  function fetchQuoteData() {
    const old = document.getElementById("stock-script");
    if (old) old.remove();

    const script = document.createElement("script");
    script.id = "stock-script";
    script.charset = "gbk";
    script.src = `https://qt.gtimg.cn/q=${currentStock}&_=${Date.now()}`;
    script.onload = () => {
      const raw = window["v_" + currentStock];
      if (raw) {
        parseAndRender(raw);
      }
    };
    document.body.appendChild(script);
  }

  function parseAndRender(raw) {
    const p = raw.split("~");
    if (p.length < 35) return;

    const name = p[1];
    const code = p[2];
    const price = parseFloat(p[3]).toFixed(2);
    const yesterdayClose = parseFloat(p[4]);
    const diff = (price - yesterdayClose).toFixed(2);
    const pct = parseFloat(p[32]).toFixed(2);
    const high = parseFloat(p[33]).toFixed(2);
    const low = parseFloat(p[34]).toFixed(2);
    const amount = (parseFloat(p[37]) / 10000).toFixed(2); // 万元转亿元
    const turnover = p[38] ? parseFloat(p[38]).toFixed(2) : "--"; // 换手率
    const pe = p[39] ? parseFloat(p[39]).toFixed(2) : "--"; // 市盈率
    const amp = p[43] ? parseFloat(p[43]).toFixed(2) : (((high - low) / yesterdayClose) * 100).toFixed(2);

    // 1. 基础价格渲染
    document.getElementById("quote-name").innerText = name;
    document.getElementById("quote-code").innerText = currentStock.toUpperCase();
    document.getElementById("quote-price").innerText = price;
    
    const isUp = pct > 0;
    const isDown = pct < 0;
    const cls = isUp ? "up" : (isDown ? "down" : "flat");
    const bgCls = isUp ? "up-bg" : (isDown ? "down-bg" : "flat-bg");
    const sign = isUp ? "+" : "";

    const changeEl = document.getElementById("quote-change");
    changeEl.innerText = `${sign}${pct}% (${sign}${diff})`;
    changeEl.className = `hero-change ${bgCls}`;

    document.getElementById("quote-price").className = `hero-price ${cls}`;
    document.getElementById("quote-time").innerText = `更新于 ${p[30].slice(8, 10)}:${p[30].slice(10, 12)}:${p[30].slice(12, 14)}`;

    // 2. 指标格
    document.getElementById("m-high").innerText = high;
    document.getElementById("m-low").innerText = low;
    document.getElementById("m-amp").innerText = `${amp}%`;
    document.getElementById("m-amount").innerText = `${amount} 亿元`;
    document.getElementById("m-turnover").innerText = `${turnover}%`;
    document.getElementById("m-pe").innerText = pe;

    // 3. 为什么涨跌：量价与异动归因分析引擎
    analyzeReason(pct, amp, turnover, price, high, low);

    // 4. 动态绑定东财与同花顺的实时新闻/异动原因直达链接
    const pureCode = getPureCode(currentStock);
    document.getElementById("link-em").href = `https://so.eastmoney.com/news/s?keyword=${encodeURIComponent(name)}`;
    document.getElementById("link-ths").href = `http://stockpage.10jqka.com.cn/${pureCode}/`;
  }

  function analyzeReason(pct, amp, turnover, price, high, low) {
    const diagTitle = document.getElementById("diag-title");
    const diagContent = document.getElementById("diag-content");
    const pctNum = parseFloat(pct);
    const ampNum = parseFloat(amp);
    const toNum = parseFloat(turnover);

    let title = "";
    let reason = "";

    if (pctNum >= 5) {
      title = "🔥 强势多头爆发：主力买盘坚决";
      reason = `今日涨幅达到 ${pct}%，振幅 ${amp}%。多方力量占据绝对主导，买盘动能充沛。通常伴随板块行业突发利好政策、业绩超预期或主力资金集中加仓扫货。建议点击下方资讯查看是否有板块共振。`;
    } else if (pctNum > 0 && pctNum < 5) {
      if (price == high) {
        title = "📈 稳健攀升，日内高点收盘";
        reason = `价格温和上行 ${pct}%，并逼近日内最高价 ${high}，盘面承接力度良好，抛压较轻，多头力量持续缓慢释放。`;
      } else {
        title = "🌤️ 震荡上行：多空良性换手";
        reason = `股价小幅上涨 ${pct}%，处于日内合理波动区间。换手率为 ${turnover}%，市场在当前价位分歧较小，资金以逢低吸纳为主。`;
      }
    } else if (pctNum <= -5) {
      title = "⚠️ 空头加速下挫：主力抛压沉重";
      reason = `日内大幅下挫 ${pct}%，跌破均线支撑。这通常是由于个股或所属板块出现突发突空消息、主力大单减持套现，或者大盘系统性资金避险出逃导致。`;
    } else if (pctNum < 0 && pctNum > -5) {
      if (ampNum > 4) {
        title = "📉 宽幅震荡洗盘 / 冲高回落";
        reason = `股价虽仅收跌 ${pct}%，但振幅高达 ${amp}%，说明日内盘中多空博弈激烈，上方存在一定套牢盘解套抛压，资金在当前位置激烈交锋。`;
      } else {
        title = "🍃 缩量阴跌 / 弱势整理";
        reason = `小幅回调 ${pct}%，换手率仅为 ${turnover}%。呈现典型的缩量整理态势，说明并没有主力恐慌性抛盘，主要是跟风盘缺失、买盘观望情绪较浓导致。`;
      }
    } else {
      title = "⚖️ 多空平衡：平盘观望态势";
      reason = "目前涨跌幅维持在 0%，多空双方力量相对均衡，资金处于横盘观望状态，等待新的消息面或大盘方向指引。";
    }

    diagTitle.innerText = title;
    diagContent.innerText = reason;
  }

  // 默认启动
  loadStock();
  // 每 5 秒自动更新一次分时图与行情
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    fetchQuoteData();
    if (currentChartType === "min") {
      updateChartImage();
    }
  }, 5000);
</script>
</body>
</html>
