<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【帝皇铠甲暴龙金刚兽的工作台】</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    body {
      background: #FFF0F4;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* 左侧栏 */
    .sidebar {
      width: 65px;
      background: #FFFFFF;
      border-right: 1px solid #FFD9E2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 0;
      gap: 10px;
      flex-shrink: 0;
    }
    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: #FFF5F8;
      color: #9E7D88;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .nav-btn.active {
      background: #FF85A1;
      color: #FFFFFF;
    }
    /* 右侧主区域 */
    .main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel {
      display: none;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #FFE2EB;
      box-shadow: 0 4px 10px rgba(255, 133, 161, 0.1);
    }
    .panel.active {
      display: block;
    }
    .clock {
      font-size: 32px;
      font-weight: 900;
      color: #FF3B69;
      margin: 6px 0;
    }
    .debug-tag {
      font-size: 11px;
      color: #2E7D32;
      font-weight: bold;
      background: #E8F5E9;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- 左侧栏 -->
  <aside class="sidebar">
    <div style="font-size: 22px; margin-bottom: 5px;">🎀</div>
    <button class="nav-btn active" onclick="goPage('desktop', this)">桌面</button>
    <button class="nav-btn" onclick="goPage('todo', this)">待办</button>
    <button class="nav-btn" onclick="goPage('study', this)">学习</button>
    <button class="nav-btn" onclick="goPage('money', this)">记账</button>
    <button class="nav-btn" onclick="goPage('diet', this)">饮食</button>
    <button class="nav-btn" onclick="goPage('review', this)">复盘</button>
  </aside>

  <!-- 右侧内容 -->
  <main class="main">
    <!-- 桌面板块 -->
    <div id="p-desktop" class="panel active">
      <span class="debug-tag" id="status-tag">脚本加载中...</span>
      <h3 style="margin-top: 8px; color: #E05A7D;">【帝皇铠甲暴龙金刚兽的工作台】</h3>
      <div class="clock" id="live-clock">--:--:--</div>
      <div id="live-date" style="font-size: 12px; color: #9E7D88;"></div>
    </div>

    <!-- 待办板块 -->
    <div id="p-todo" class="panel">
      <h3 style="color: #E05A7D;">待办板块</h3>
      <p style="font-size: 13px; color: #666; margin-top: 8px;">这里是待办内容，点击切换成功！</p>
    </div>

    <!-- 学习板块 -->
    <div id="p-study" class="panel">
      <h3 style="color: #E05A7D;">学习板块（英语 / AI / 文案）</h3>
      <p style="font-size: 13px; color: #666; margin-top: 8px;">学习模块显示正常！</p>
    </div>

    <!-- 记账板块 -->
    <div id="p-money" class="panel">
      <h3 style="color: #E05A7D;">记账板块</h3>
      <p style="font-size: 13px; color: #666; margin-top: 8px;">记账模块显示正常！</p>
    </div>

    <!-- 饮食板块 -->
    <div id="p-diet" class="panel">
      <h3 style="color: #E05A7D;">饮食板块</h3>
      <p style="font-size: 13px; color: #666; margin-top: 8px;">饮食记录显示正常！</p>
    </div>

    <!-- 复盘板块 -->
    <div id="p-review" class="panel">
      <h3 style="color: #E05A7D;">周复盘板块</h3>
      <p style="font-size: 13px; color: #666; margin-top: 8px;">周复盘显示正常！</p>
    </div>
  </main>

  <script>
    // 1. 切换逻辑
    function goPage(id, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      const target = document.getElementById('p-' + id);
      if (target) target.classList.add('active');
    }

    // 2. 时钟逻辑
    function tick() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('live-clock').innerText = `${h}:${m}:${s}`;
      document.getElementById('live-date').innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
    }
    setInterval(tick, 1000);
    tick();

    // 3. 运行状态提示
    document.getElementById('status-tag').innerText = '✅ JavaScript 运行正常';
  </script>
</body>
</html>
