<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人工作台 · Workspace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0D1117;
      color: #C9D1D9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .workspace {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 顶部问候与时间看板 */
    .hero-header {
      background: linear-gradient(135deg, #161B22 0%, #1F242C 100%);
      border: 1px solid #30363D;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .greeting-title {
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .greeting-sub {
      font-size: 13px;
      color: #8B949E;
    }
    .clock-display {
      font-size: 38px;
      font-weight: 800;
      color: #58A6FF;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
    }

    /* 双栏主体布局 */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 680px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    /* 卡片通用 */
    .card {
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #F0F6FC;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 工具导航矩阵 */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .tool-item {
      background: #0D1117;
      border: 1px solid #21262D;
      border-radius: 10px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .tool-item:hover {
      border-color: #58A6FF;
      transform: translateY(-2px);
      background: #161B22;
    }
    .tool-icon {
      font-size: 26px;
      margin-bottom: 6px;
    }
    .tool-name {
      font-size: 13px;
      font-weight: 600;
      color: #E6EDF3;
    }
    .tool-desc {
      font-size: 11px;
      color: #8B949E;
      margin-top: 2px;
    }

    /* 番茄钟卡片 */
    .pomo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    .pomo-timer {
      font-size: 44px;
      font-weight: 800;
      color: #FFA657;
      font-variant-numeric: tabular-nums;
    }
    .pomo-btns {
      display: flex;
      gap: 10px;
    }
    .pomo-btn {
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .pomo-btn.start { background: #238636; color: white; }
    .pomo-btn.reset { background: #21262D; color: #8B949E; border: 1px solid #30363D; }

    /* 今日待办 */
    .todo-input-bar {
      display: flex;
      gap: 8px;
    }
    .todo-input {
      flex: 1;
      background: #0D1117;
      border: 1px solid #30363D;
      border-radius: 6px;
      padding: 6px 10px;
      color: white;
      font-size: 13px;
      outline: none;
    }
    .todo-input:focus { border-color: #58A6FF; }
    .todo-add-btn {
      background: #238636;
      border: none;
      color: white;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0D1117;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid #21262D;
    }
    .todo-item.done span {
      text-decoration: line-through;
      color: #484F58;
    }
    .del-btn {
      color: #8B949E;
      cursor: pointer;
      font-size: 12px;
    }
    .del-btn:hover { color: #F85149; }

    /* 快捷链接网格 */
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .link-chip {
      background: #0D1117;
      border: 1px solid #30363D;
      color: #58A6FF;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      transition: 0.2s;
    }
    .link-chip:hover {
      background: #1F242C;
      border-color: #58A6FF;
    }
  </style>
</head>
<body>

<div class="workspace">
  <!-- 问候与时钟 -->
  <div class="hero-header">
    <div>
      <div class="greeting-title" id="greeting-txt">你好，开始专注的一天</div>
      <div class="greeting-sub" id="date-txt">加载日期中...</div>
    </div>
    <div class="clock-display" id="time-txt">00:00:00</div>
  </div>

  <!-- 核心工具矩阵 -->
  <div class="card">
    <div class="card-title">🚀 我的工具箱 (My Apps)</div>
    <div class="tool-grid">
      <a href="game.html" class="tool-item">
        <span class="tool-icon">🪵</span>
        <span class="tool-name">解压木鱼</span>
        <span class="tool-desc">水豚投喂 / 烦恼粉碎</span>
      </a>
      <a href="capy.html" class="tool-item">
        <span class="tool-icon">📝</span>
        <span class="tool-name">桌面便签</span>
        <span class="tool-desc">看板分类 / 灵感速记</span>
      </a>
      <a href="stock.html" class="tool-item">
        <span class="tool-icon">📈</span>
        <span class="tool-name">股票监控</span>
        <span class="tool-desc">走势分时 / 盘面诊断</span>
      </a>
    </div>
  </div>

  <!-- 主体工作区 (双栏) -->
  <div class="grid-container">
    <!-- 番茄钟 -->
    <div class="card">
      <div class="card-title">⏱️ 番茄专注钟 (Pomodoro)</div>
      <div class="pomo-wrap">
        <div class="pomo-timer" id="pomo-time">25:00</div>
        <div class="pomo-btns">
          <button class="pomo-btn start" id="pomo-toggle" onclick="togglePomodoro()">开始专注</button>
          <button class="pomo-btn reset" onclick="resetPomodoro()">重置</button>
        </div>
      </div>
      <div style="font-size: 11px; color: #8B949E; text-align: center;">25 分钟专注，5 分钟休息，劳逸结合</div>
    </div>

    <!-- 迷你待办清单 -->
    <div class="card">
      <div class="card-title">📋 今日待办清单</div>
      <div class="todo-input-bar">
        <input type="text" id="todo-input" class="todo-input" placeholder="添加待办事项..." onkeydown="if(event.key==='Enter')addTodo()">
        <button class="todo-add-btn" onclick="addTodo()">添加</button>
      </div>
      <ul class="todo-list" id="todo-list"></ul>
    </div>
  </div>

  <!-- 常用外链导航 -->
  <div class="card">
    <div class="card-title">🔗 快速通道 (Bookmarks)</div>
    <div class="quick-links">
      <a href="https://github.com/execute-xm/pomodoro" target="_blank" class="link-chip">🐙 本仓库 GitHub</a>
      <a href="https://github.com" target="_blank" class="link-chip">💻 GitHub 首页</a>
      <a href="https://www.bilibili.com" target="_blank" class="link-chip">📺 哔哩哔哩</a>
      <a href="https://www.zhihu.com" target="_blank" class="link-chip">📖 知乎</a>
      <a href="https://v2ex.com" target="_blank" class="link-chip">💬 V2EX</a>
      <a href="https://juejin.cn" target="_blank" class="link-chip">⚡ 稀土掘金</a>
    </div>
  </div>
</div>

<script>
  // 1. 实时时间与动态问候
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById("time-txt").innerText = `${h}:${m}:${s}`;

    const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · ${days[now.getDay()]}`;
    document.getElementById("date-txt").innerText = dateStr;

    const hour = now.getHours();
    let greet = "晚上好，愿今天收获满满";
    if (hour >= 5 && hour < 12) greet = "早上好，元气满满的一天开始啦 ☀️";
    else if (hour >= 12 && hour < 18) greet = "下午好，保持专注与高效 ☕";
    document.getElementById("greeting-txt").innerText = greet;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 2. 番茄钟
  let timeLeft = 25 * 60;
  let timerInterval = null;
  let isPomoRunning = false;

  function formatTime(seconds) {
    const min = String(Math.floor(seconds / 60)).padStart(2, '0');
    const sec = String(seconds % 60).padStart(2, '0');
    return `${min}:${sec}`;
  }

  function togglePomodoro() {
    const btn = document.getElementById("pomo-toggle");
    if (!isPomoRunning) {
      isPomoRunning = true;
      btn.innerText = "暂停专注";
      btn.style.background = "#D29922";
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          document.getElementById("pomo-time").innerText = formatTime(timeLeft);
        } else {
          clearInterval(timerInterval);
          isPomoRunning = false;
          btn.innerText = "开始专注";
          btn.style.background = "#238636";
          alert("🎉 恭喜！一个番茄时间已完成，去敲敲水豚休息 5 分钟吧！");
          resetPomodoro();
        }
      }, 1000);
    } else {
      isPomoRunning = false;
      btn.innerText = "继续专注";
      btn.style.background = "#238636";
      clearInterval(timerInterval);
    }
  }

  function resetPomodoro() {
    clearInterval(timerInterval);
    isPomoRunning = false;
    timeLeft = 25 * 60;
    document.getElementById("pomo-time").innerText = "25:00";
    const btn = document.getElementById("pomo-toggle");
    btn.innerText = "开始专注";
    btn.style.background = "#238636";
  }

  // 3. 今日待办逻辑
  let todos = JSON.parse(localStorage.getItem("ws_todos") || "[]");

  function saveAndRenderTodos() {
    localStorage.setItem("ws_todos", JSON.stringify(todos));
    const list = document.getElementById("todo-list");
    list.innerHTML = "";
    if (todos.length === 0) {
      list.innerHTML = `<li style="text-align:center; font-size:12px; color:#484F58; padding:12px;">暂无待办，输入即可添加 ✨</li>`;
      return;
    }
    todos.forEach((todo, idx) => {
      const li = document.createElement("li");
      li.className = `todo-item ${todo.done ? 'done' : ''}`;
      li.innerHTML = `
        <div style="display:flex; align-items:center; gap:8px; cursor:pointer;" onclick="toggleTodo(${idx})">
          <input type="checkbox" ${todo.done ? 'checked' : ''} style="cursor:pointer;">
          <span>${todo.text}</span>
        </div>
        <span class="del-btn" onclick="deleteTodo(${idx})">✕</span>
      `;
      list.appendChild(li);
    });
  }

  function addTodo() {
    const input = document.getElementById("todo-input");
    const val = input.value.trim();
    if (!val) return;
    todos.push({ text: val, done: false });
    input.value = "";
    saveAndRenderTodos();
  }

  function toggleTodo(idx) {
    todos[idx].done = !todos[idx].done;
    saveAndRenderTodos();
  }

  function deleteTodo(idx) {
    todos.splice(idx, 1);
    saveAndRenderTodos();
  }

  saveAndRenderTodos();
</script>
</body>
</html>
