<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 软萌工作台 · Cozy Workspace 🍓</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 50%, #FFDFE8 100%);
      color: #6D4C57;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
    }

    /* 漂浮装饰 */
    .floating-decor {
      position: fixed;
      font-size: 22px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      animation: floatUpSlow linear infinite;
    }
    @keyframes floatUpSlow {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      15% { opacity: 0.45; }
      85% { opacity: 0.45; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* 主布局容器：稳定的左右并排 */
    .workspace-wrap {
      width: 100%;
      max-width: 1100px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 860px) {
      .workspace-wrap {
        flex-direction: column;
      }
    }

    /* 左侧边栏（固定宽度） */
    .side-panel {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (max-width: 860px) {
      .side-panel {
        width: 100%;
      }
    }

    /* 右侧主内容区（弹性伸缩） */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    /* 通用粉色卡片 */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1.5px solid #FFD6DF;
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(255, 182, 193, 0.25);
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: #D45B7A;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 左侧工具按钮 */
    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tool-btn {
      background: #FFF5F7;
      border: 1.5px solid #FFD6DF;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .tool-btn:hover {
      background: #FFE9EE;
      border-color: #FF8DA1;
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(255, 141, 161, 0.2);
    }
    .tool-icon {
      font-size: 26px;
      flex-shrink: 0;
    }
    .tool-info {
      display: flex;
      flex-direction: column;
    }
    .tool-name {
      font-size: 14px;
      font-weight: 700;
      color: #9E3E58;
    }
    .tool-desc {
      font-size: 11px;
      color: #B58390;
      margin-top: 2px;
    }

    /* 随手备忘录 */
    .memo-area {
      width: 100%;
      height: 110px;
      background: #FFF5F7;
      border: 1.5px solid #FFD6DF;
      border-radius: 12px;
      padding: 10px;
      color: #6D4C57;
      font-size: 12px;
      outline: none;
      resize: none;
      line-height: 1.5;
    }
    .memo-area:focus {
      border-color: #FF6B8B;
      background: #FFFFFF;
    }

    /* 顶部问候横幅 */
    .hero-header {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid #FFD1DC;
      border-radius: 22px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.35);
    }
    .greet-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .greet-title {
      font-size: 20px;
      font-weight: 800;
      color: #E85A7F;
      transition: opacity 0.3s ease;
    }
    .refresh-btn {
      background: #FFE4EC;
      border: 1px solid #FFB6C1;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }
    .clock-num {
      font-size: 38px;
      font-weight: 900;
      color: #FF6B8B;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
    }

    /* 右侧双栏模块（番茄钟 + 今日待办） */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 680px) {
      .two-col-grid { grid-template-columns: 1fr; }
    }

    /* 番茄钟 */
    .pomo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }
    .pomo-timer {
      font-size: 44px;
      font-weight: 900;
      color: #FF5A79;
      font-variant-numeric: tabular-nums;
    }
    .pomo-btns {
      display: flex;
      gap: 10px;
    }
    .pomo-btn {
      padding: 6px 18px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .pomo-btn.start {
      background: linear-gradient(135deg, #FF7B95 0%, #FF5A79 100%);
      color: white;
      box-shadow: 0 4px 10px rgba(255, 90, 121, 0.3);
    }
    .pomo-btn.reset {
      background: #FFE8ED;
      color: #A36B79;
      border: 1px solid #FFCAD4;
    }

    /* 输入栏与列表 */
    .input-bar {
      display: flex;
      gap: 8px;
    }
    .text-input {
      flex: 1;
      background: #FFF5F7;
      border: 1.5px solid #FFD6DF;
      border-radius: 10px;
      padding: 7px 10px;
      color: #6D4C57;
      font-size: 12px;
      outline: none;
    }
    .text-input:focus {
      border-color: #FF6B8B;
      background: #FFFFFF;
    }
    .action-btn {
      background: linear-gradient(135deg, #FF7B95 0%, #FF5A79 100%);
      border: none;
      color: white;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFF8F9;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      border: 1px solid #FFE4E8;
    }
    .list-row.done span {
      text-decoration: line-through;
      color: #BFA5AD;
    }
    .del-btn {
      color: #D89FA9;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .del-btn:hover { color: #FF4757; }

    /* 每周复盘网格 */
    .review-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 580px) {
      .review-grid { grid-template-columns: 1fr; }
    }
    .review-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .review-label {
      font-size: 11px;
      font-weight: 700;
      color: #9E3E58;
    }

    /* 快捷网址 */
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .link-chip {
      background: #FFF2F5;
      border: 1.5px solid #FFD1DC;
      color: #C74D6C;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      transition: 0.2s;
    }
    .link-chip:hover {
      background: #FFE1E8;
      border-color: #FF7B95;
      transform: translateY(-2px);
    }
  </style>
</head>
