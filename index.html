<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【(🌳) 的工作台】</title>
  <style>
    :root {
      --bg-pink: #FFF0F4;
      --card-bg: rgba(255, 255, 255, 0.96);
      --primary-pink: #FF85A1;
      --deep-pink: #E05A7D;
      --soft-pink: #FFD9E2;
      --text-main: #5C3E48;
      --text-sub: #9E7D88;
      --accent-bow: #FF3B69;
      --border-pink: #FFE2EB;
      --radius-card: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }

    /* 手机和电脑统一：左侧栏 + 右侧内容并排 */
    body {
      background: linear-gradient(135deg, #FFF0F4 0%, #FFE6EC 50%, #FFDCE6 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      overflow-x: hidden;
      width: 100vw;
    }

    /* 左侧固定垂直侧边导航栏 (移动端与PC端完全一致保持在左侧) */
    .sidebar {
      width: 58px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.95);
      border-right: 1.5px solid var(--border-pink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      box-shadow: 2px 0 10px rgba(255, 133, 161, 0.12);
    }

    .brand-avatar {
      width: 38px;
      height: 38px;
      background: #FFE8EF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1.5px solid var(--primary-pink);
      flex-shrink: 0;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      align-items: center;
    }

    .nav-item {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-sub);
      gap: 1px;
      transition: all 0.2s;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 8px rgba(255, 117, 151, 0.35);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .nav-label {
      font-size: 9px;
      font-weight: 700;
    }

    /* 右侧主视口内容区 */
    .viewport {
      flex: 1;
      padding: 12px 10px 30px;
      max-width: 650px;
      width: calc(100vw - 58px);
      min-width: 0;
      overflow-y: auto;
    }

    /* 模块页面容器 */
    .module-page {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .module-page.active-page {
      display: flex !important;
    }

    /* 少女粉圆角卡片 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      border: 1.5px solid var(--border-pink);
      padding: 14px;
      box-shadow: 0 4px 12px rgba(255, 133, 161, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--deep-pink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 首页大号时钟 */
    .hero-header {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF4F7 100%);
      border: 2px solid var(--soft-pink);
      padding: 14px;
    }
    .greeting-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--deep-pink);
    }
    .clock-large {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent-bow);
      letter-spacing: -1px;
      line-height: 1.1;
      margin: 3px 0;
      font-variant-numeric: tabular-nums;
    }
    .date-info {
      font-size: 11px;
      color: var(--text-sub);
    }

    /* 中英文语录卡片 */
    .quote-card {
      background: #FFF7F9;
      border-left: 4px solid var(--primary-pink);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .quote-zh {
      font-size: 12px;
      font-weight: bold;
      color: var(--deep-pink);
    }
    .quote-en {
      font-size: 10px;
      color: var(--text-sub);
      font-style: italic;
    }

    /* 打卡区按钮 */
    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .checkin-btn {
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 10px;
      padding: 8px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .checkin-btn .name {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-main);
    }
    .checkin-btn.checked {
      background: linear-gradient(135deg, #FFB8C9 0%, #FF85A1 100%);
      border-color: var(--primary-pink);
      box-shadow: 0 3px 6px rgba(255, 133, 161, 0.25);
    }
    .checkin-btn.checked .name {
      color: #FFFFFF;
      font-weight: 800;
    }

    /* 今日概览 */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .overview-item {
      background: #FFF8FA;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      border: 1px solid var(--border-pink);
    }
    .overview-item .val {
      font-size: 14px;
      font-weight: 800;
      color: var(--deep-pink);
      margin-top: 2px;
    }
    .overview-item .lbl {
      font-size: 10px;
      color: var(--text-sub);
    }

    /* 表单与输入 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .form-row {
      display: flex;
      gap: 5px;
    }
    .custom-input, select, textarea {
      width: 100%;
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 9px;
      padding: 7px 8px;
      font-size: 11px;
      color: var(--text-main);
      outline: none;
    }
    .custom-input:focus, select:focus, textarea:focus {
      border-color: var(--primary-pink);
      background: #FFFFFF;
    }
    .primary-btn {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%);
      border: none;
      color: #FFFFFF;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 列表项 */
    .stream-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .stream-item {
      background: #FFF9FB;
      border: 1.5px solid var(--border-pink);
      border-radius: 9px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
    }
    .stream-item.is-done span {
      text-decoration: line-through;
      color: #C2A5AE;
    }
    .delete-action {
      color: #E29CA9;
      cursor: pointer;
      font-weight: bold;
