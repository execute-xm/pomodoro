<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【(🌳) 的工作台】</title>
  <style>
    :root {
      --bg-pink: #FFF0F4;
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary-pink: #FF85A1;
      --deep-pink: #E05A7D;
      --soft-pink: #FFD9E2;
      --text-main: #5C3E48;
      --text-sub: #9E7D88;
      --accent-bow: #FF3B69;
      --border-pink: #FFE2EB;
      --radius-card: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FFF0F4 0%, #FFE6EC 50%, #FFDCE6 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* 左侧固定垂直侧边导航栏 */
    .sidebar {
      width: 72px;
      background: rgba(255, 255, 255, 0.96);
      border-right: 1.5px solid var(--border-pink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      box-shadow: 2px 0 12px rgba(255, 133, 161, 0.12);
    }

    .brand-avatar {
      width: 44px;
      height: 44px;
      background: #FFE8EF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border: 1.5px solid var(--primary-pink);
      box-shadow: 0 4px 8px rgba(255, 133, 161, 0.2);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .nav-item {
      width: 56px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-sub);
      gap: 2px;
    }

    .nav-item:hover {
      background: #FFF5F8;
    }

    .nav-item.active {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(255, 117, 151, 0.35);
      transform: scale(1.03);
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
    }

    /* 右侧主视口内容区 */
    .viewport {
      margin-left: 72px;
      flex: 1;
      padding: 16px 14px 36px;
      max-width: 600px;
      width: 100%;
      margin-right: auto;
    }

    /* 模块容器卡片 */
    .module-page {
      display: none;
      animation: fadeInPage 0.2s ease-out forwards;
    }
    .module-page.active-page {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      border: 1.5px solid var(--border-pink);
      padding: 16px;
      box-shadow: 0 6px 16px rgba(255, 133, 161, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--deep-pink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 顶部仪表盘卡片 */
    .hero-header {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF4F7 100%);
      border: 2px solid var(--soft-pink);
      padding: 18px;
    }

    .greeting-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--deep-pink);
    }

    .clock-large {
      font-size: 40px;
      font-weight: 900;
      color: var(--accent-bow);
      letter-spacing: -1px;
      line-height: 1.1;
      margin: 4px 0;
      font-variant-numeric: tabular-nums;
    }

    .date-info {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 中英文语录卡片 */
    .quote-card {
      background: #FFF7F9;
      border-left: 4px solid var(--primary-pink);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .quote-zh {
      font-size: 13px;
      font-weight: bold;
      color: var(--deep-pink);
      line-height: 1.4;
    }
    .quote-en {
      font-size: 11px;
      color: var(--text-sub);
      font-style: italic;
    }

    /* 每日打卡区按钮 */
    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .checkin-btn {
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 12px;
      padding: 9px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .checkin-btn .icon {
      font-size: 18px;
    }

    .checkin-btn .name {
      font-size: 11px;
      color: var(--text-main);
      font-weight: 600;
    }

    .checkin-btn.checked {
      background: linear-gradient(135deg, #FFB8C9 0%, #FF85A1 100%);
      border-color: var(--primary-pink);
      box-shadow: 0 4px 8px rgba(255, 133, 161, 0.25);
      transform: translateY(-2px);
    }
    .checkin-btn.checked .name {
      color: #FFFFFF;
      font-weight: 800;
    }

    /* 今日概览 */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .overview-item {
      background: #FFF8FA;
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      border: 1px solid var(--border-pink
