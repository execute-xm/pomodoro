<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【(🌳) 的工作台】</title>
  <style>
    :root {
      --bg: #FFF0F4;
      --card-bg: #FFFFFF;
      --primary: #FF85A1;
      --deep-pink: #E05A7D;
      --text: #5C3E48;
      --sub: #9E7D88;
      --border: #FFE2EB;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: row;
      min-height: 100vh;
    }

    /* 左侧固定侧边栏 */
    .sidebar {
      width: 60px;
      background: #FFFFFF;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15px;
      gap: 12px;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
    }
    .nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: var(--sub);
      cursor: pointer;
      border: none;
      background: transparent;
      gap: 2px;
    }
    .nav-btn.active {
      background: var(--primary);
      color: #FFFFFF;
    }

    /* 右侧主视口 */
    .content {
      flex: 1;
      padding: 16px 12px;
      max-width: 600px;
      overflow-y: auto;
    }
    .page-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .page-section.show {
      display: flex !important;
    }

    /* 卡片通用 */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 14px;
      box-shadow: 0 4px 10px rgba(255, 133, 161, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: var(--deep-pink);
      display: flex;
      justify-content: space-between;
    }
    .clock {
      font-size: 32px;
      font-weight: 900;
      color: var(--deep-pink);
    }
    .input-box {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
      background: #FFF9FB;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .list-item {
      padding: 8px;
      background: #FFF9FB;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      border: 1px solid var(--border);
    }
    .tag-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .tag-btn {
      padding: 6px 2px;
      text-align: center;
      font-size: 10px;
      background: #FFF9FB;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    .tag-btn.done {
      background: var(--primary);
      color: white;
    }
  </style>
</head>
<body>

  <!-- 左侧垂直侧边栏 -->
  <aside class="sidebar">
    <div style="font-size: 20px; margin-bottom: 6px;">🎀</div>
    <button class="nav-btn active" onclick="tab('desktop', this)">桌面</button>
    <button class="nav-btn" onclick="tab('todo', this)">待办</button>
    <button class="nav-btn" onclick="tab('diet', this)">饮食</button>
    <button class="nav-btn" onclick="tab('money', this)">记账</button>
    <button class="nav-btn" onclick="tab('diary', this)">日记</button>
    <button class="nav-btn" onclick="tab('settings', this)">设置</button>
  </aside>

  <!-- 右侧内容区域 -->
  <main class="content">

    <!-- 1. 桌面 -->
    <section id="p-desktop" class="page-section show">
      <div class="card">
        <div style="font-size: 12px; color: var(--sub);">你好呀，【(🌳) 的工作台】🌸</div>
        <div class="clock" id="clock-txt">00:00:00</div>
        <div id="date-txt" style="font-size: 11px; color: var(--sub);"></div>
      </div>

      <div class="card" style="border-left: 4px solid var(--primary);">
        <div style="font-size: 12px; font-weight: bold; color: var(--deep-pink);">“保持热爱，奔赴山海，今天的你也很棒。”</div>
        <div style="font-size: 10px; color: var(--sub); font-style: italic;">"Keep loving, keep shining every day."</div>
      </div>

      <div class="card">
        <div class="card-title">每日打卡</div>
        <div class="tag-grid">
          <div class="tag-btn" onclick="checkin(this)">🌅 早起</div>
          <div class="tag-btn" onclick="checkin(this)">💧 饮水</div>
          <div class="tag-btn" onclick="checkin(this)">🏃‍♀️ 运动</div>
          <div class="tag-btn" onclick="checkin(this)">📖 阅读</div>
          <div class="tag-btn" onclick="checkin(this)">🌙 早睡</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">今日概览</div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; text-align: center;">
          <div><div style="color:var(--sub)">待办</div><b id="ov-todo">0项</b></div>
          <div><div style="color:var(--sub)">热量</div><b id="ov-cal">0 kcal</b></div>
          <div><div style="color:var(--sub)">支出</div><b id="ov-money">￥0.00</b></div>
        </div>
      </div>
    </section>

    <!-- 2. 待办 -->
    <section id="p-todo" class="page-section">
      <div class="card">
        <div class="card-title">添加待办</div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="todo-input" class="input-box" placeholder="输入任务...">
          <button class="btn" onclick="addTodo()">添加</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">今日待办</div>
        <div id="todo-list" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </section>

    <!-- 3. 饮食 -->
    <section id="p-diet" class="page-section">
      <div class="card">
        <div class="card-title">记录饮食</div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="diet-name" class="input-box" placeholder="食物名称">
          <input type="number" id="diet-cal" class="input-box" placeholder="卡路里(kcal)">
        </div>
        <button class="btn" style="align-self: flex-end;" onclick="addDiet()">记录</button>
      </div>
      <div class="card">
        <div class="card-title">今日摄入历史</div>
        <div id="diet-list" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </section>

    <!-- 4. 记账 -->
    <section id="p-money" class="page-section">
      <div class="card">
        <div class="card-title">记一笔</div>
        <div style="display:flex; gap:6px;">
          <input type="number" id="m-val" class="input-box" placeholder="金额 (￥)">
          <select id="m-type" class="input-box" style="width:90px;">
            <option value="餐饮">餐饮</option>
            <option value="交通">交通</option>
            <option value="购物">购物</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <button class="btn" style="align-self: flex-end;" onclick="addMoney()">记账</button>
      </div>
      <div class="card">
        <div class="card-title">消费流水</div>
        <div id="money-list" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </section>

    <!-- 5. 日记 -->
    <section id="p-diary" class="page-section">
      <div class="card">
        <div class="card-title">今日三件事日记</div>
        <input type="text" id="dia-1" class="input-box" placeholder="🌸 3件觉得感恩的事...">
        <input type="text" id="dia-2" class="input-box" placeholder="🌿 2件值得改进的事...">
        <input type="text" id="dia-3" class="input-box" placeholder="✨ 1件对自己肯定的事...">
        <button class="btn" style="align-self: flex-end;" onclick="saveDiary()">保存日记</button>
      </div>
    </section>

    <!-- 6. 设置 -->
    <section id="p-settings" class="page-section">
      <div class="card">
        <div class="card-title">设置与备份</div>
        <div style="font-size: 11px; color: var(--sub);">所有数据均保存在浏览器本地。</div>
        <button class="btn" style="background:#E25574; align-self: flex-start;" onclick="localStorage.clear(); location.reload();">清空所有数据</button>
      </div>
    </section>

  </main>

  <script>
    // 页面切换
    function tab(name, el) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.page-section').forEach(s => s.classList.remove('show'));
      document.getElementById('p-' + name).classList.add('show');
    }

    // 时钟
    function updateClock() {
      const d = new Date();
      document.getElementById('clock-txt').innerText = d.toTimeString().split(' ')[0];
      document.getElementById('date-txt').innerText = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 打卡
    function checkin(el) {
      el.classList.toggle('done');
    }

    // 待办
    let todos = JSON.parse(localStorage.getItem('wk_mini_todos') || '[]');
    function renderTodos() {
      const box = document.getElementById('todo-list');
      box.innerHTML = '';
      todos.forEach((t, i) => {
        box.innerHTML += `<div class="list-item"><span>${t}</span><span style="cursor:pointer;color:red;" onclick="delTodo(${i})">✕</span></div>`;
      });
      document.getElementById('ov-todo').innerText = todos.length + '项';
      localStorage.setItem('wk_mini_todos', JSON.stringify(todos));
    }
    function addTodo() {
      const input = document.getElementById('todo-input');
      if (!input.value) return;
      todos.push(input.value);
      input.value = '';
      renderTodos();
    }
    function delTodo(i) {
      todos.splice(i, 1);
      renderTodos();
    }
    renderTodos();

    // 饮食
    let diets = JSON.parse(localStorage.getItem('wk_mini_diet') || '[]');
    function renderDiet() {
      const box = document.getElementById('diet-list');
      box.innerHTML = '';
      let sum = 0;
      diets.forEach((d, i) => {
        sum += Number(d.cal);
        box.innerHTML += `<div class="list-item"><span>${d.name}</span><b>${d.cal} kcal</b></div>`;
      });
      document.getElementById('ov-cal').innerText = sum + ' kcal';
      localStorage.setItem('wk_mini_diet', JSON.stringify(diets));
    }
    function addDiet() {
      const n = document.getElementById('diet-name').value;
      const c = document.getElementById('diet-cal').value;
      if (!n || !c) return;
      diets.push({name: n, cal: c});
      document.getElementById('diet-name').value = '';
      document.getElementById('diet-cal').value = '';
      renderDiet();
    }
    renderDiet();

    // 记账
    let moneys = JSON.parse(localStorage.getItem('wk_mini_money') || '[]');
    function renderMoney() {
      const box = document.getElementById('money-list');
      box.innerHTML = '';
      let total = 0;
      moneys.forEach(m => {
        total += Number(m.v);
        box.innerHTML += `<div class="list-item"><span>${m.t}</span><b style="color:var(--deep-pink)">-￥${m.v}</b></div>`;
      });
      document.getElementById('ov-money').innerText = '￥' + total.toFixed(2);
      localStorage.setItem('wk_mini_money', JSON.stringify(moneys));
    }
    function addMoney() {
      const v = document.getElementById('m-val').value;
      const t = document.getElementById('m-type').value;
      if (!v) return;
      moneys.push({v: v, t: t});
      document.getElementById('m-val').value = '';
      renderMoney();
    }
    renderMoney();

    // 日记
    function saveDiary() {
      alert('日记已保存！🌸');
    }
  </script>
</body>
</html>
