<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【帝皇铠甲暴龙金刚兽的工作台】</title>
  <style>
    :root {
      --bg: #FFF0F4;
      --card-bg: rgba(255, 255, 255, 0.98);
      --primary: #FF85A1;
      --deep-pink: #E05A7D;
      --soft-pink: #FFD9E2;
      --text: #5C3E48;
      --sub: #9E7D88;
      --accent: #FF3B69;
      --border: #FFE2EB;
      --radius: 16px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }
    body {
      background: linear-gradient(135deg, #FFF0F4 0%, #FFE6EC 50%, #FFDCE6 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      overflow-x: hidden;
      width: 100vw;
    }
    .sidebar {
      width: 62px;
      min-width: 62px;
      max-width: 62px;
      background: rgba(255, 255, 255, 0.96);
      border-right: 1.5px solid var(--border);
      display: flex !important;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 2px 0 10px rgba(255, 133, 161, 0.12);
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .brand-avatar {
      width: 36px;
      height: 36px;
      background: #FFE8EF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      border: 1.5px solid var(--primary);
      flex-shrink: 0;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      align-items: center;
    }
    .nav-btn {
      width: 50px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--sub);
      gap: 2px;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
      user-select: none;
      flex-shrink: 0;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%) !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 8px rgba(255, 117, 151, 0.35);
    }
    .nav-icon {
      width: 14px;
      height: 14px;
      fill: currentColor;
      pointer-events: none;
    }
    .nav-label {
      font-size: 8px;
      font-weight: 700;
      pointer-events: none;
    }
    .viewport {
      flex: 1;
      padding: 12px 10px 50px;
      max-width: 650px;
      width: calc(100vw - 62px);
      overflow-y: auto;
      height: 100vh;
    }
    .panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    #p-desktop { display: flex; }
    .panel.active { display: flex !important; }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      padding: 14px;
      box-shadow: 0 4px 12px rgba(255, 133, 161, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--deep-pink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .clock-hero {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF4F7 100%);
      border: 2px solid var(--soft-pink);
    }
    .clock-large {
      font-size: 38px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: -1px;
      margin: 4px 0 2px;
      font-variant-numeric: tabular-nums;
    }
    .combined-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFF7F9;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--sub);
    }
    .water-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }
    .water-cup {
      background: #FFF8FA;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 6px 0;
      text-align: center;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .water-cup.on {
      background: linear-gradient(135deg, #FFB8C9 0%, #FF85A1 100%);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .mood-btn {
      background: #FFF8FA;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      cursor: pointer;
      color: var(--sub);
    }
    .mood-btn.on {
      background: #FFE8EE;
      border-color: var(--primary);
      color: var(--deep-pink);
      font-weight: bold;
    }
    .habit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .habit-btn {
      background: #FFF8FA;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
    }
    .habit-btn.on {
      background: linear-gradient(135deg, #FFB8C9 0%, #FF85A1 100%);
      border-color: var(--primary);
      color: #FFFFFF;
      font-weight: 800;
    }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .overview-box {
      background: #FFF8FA;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .overview-box .val {
      font-size: 14px;
      font-weight: 800;
      color: var(--deep-pink);
      margin-top: 2px;
    }
    .overview-box .lbl {
      font-size: 10px;
      color: var(--sub);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .form-row {
      display: flex;
      gap: 5px;
    }
    .custom-input, select, textarea {
      width: 100%;
      background: #FFF8FA;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 7px 8px;
      font-size: 11px;
      color: var(--text);
      outline: none;
    }
    .custom-input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }
    .primary-btn {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%);
      border: none;
      color: #FFFFFF;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .stream-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .stream-item {
      background: #FFF9FB;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
    }
    .stream-item.is-done span {
      text-decoration: line-through;
      color: #C2A5AE;
    }
    .delete-action {
      color: #E29CA9;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      padding: 2px 4px;
    }
    .priority-tag {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 5px;
      font-weight: bold;
    }
    .p-high { background: #FFE0E6; color: #E0355A; }
    .p-mid { background: #FFF0D6; color: #D47B00; }
    .p-low { background: #E8F5E9; color: #2E7D32; }
    .study-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: bold;
    }
    .b-en { background: #E3F2FD; color: #1976D2; }
    .b-ai { background: #EDE7F6; color: #5E35B1; }
    .b-copy { background: #FCE4EC; color: #C2185B; }
    .pomo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }

      font-size: 38px;
      font-weight: 900;
      color: var(--deep-
