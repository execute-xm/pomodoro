<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 软萌粉色工作台 · Cozy Workspace 🍓</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 50%, #FFDFE8 100%);
      color: #6D4C57;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景漂浮萌物动画 */
    .floating-decor {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      animation: floatUpSlow linear infinite;
    }
    @keyframes floatUpSlow {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      15% { opacity: 0.55; }
      85% { opacity: 0.55; }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    /* 左右分栏总布局 */
    .workspace-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      position: relative;
      z-index: 1;
      align-items: start;
    }
    @media (max-width: 860px) {
      .workspace-layout {
        grid-template-columns: 1fr;
      }
    }

    /* 通用粉色卡片 */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1.5px solid #FFE0E6;
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(255, 182, 193, 0.22);
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: #D45B7A;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ======= 左侧工作台栏 ======= */
    .sidebar-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 24px;
    }
    .tool-list-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tool-item {
      background: #FFF5F7;
      border: 1.5px solid #FFD6DF;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .tool-item:hover {
      background: #FFE9EE;
      border-color: #FF8DA1;
      transform: translateX(4px) scale(1.02);
      box-shadow: 0 6px 14px rgba(255, 141, 161, 0.25);
    }
    .tool-icon {
      font-size: 26px;
      flex-shrink: 0;
    }
    .tool-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .tool-name {
      font-size: 13px;
      font-weight: 700;
      color: #9E3E58;
    }
    .tool-desc {
      font-size: 11px;
      color: #B58390;
      margin-top: 2px;
    }

    /* ======= 右侧主内容区 ======= */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 顶部问候卡片 */
    .hero-header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 2px solid #FFD1DC;
      border-radius: 22px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(255, 182, 193, 0.35);
    }
    .greeting-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .greeting-title {
      font-size: 20px;
      font-weight: 800;
      color: #E85A7F;
      transition: opacity 0.3s ease, transform 0.3s ease;
      display: inline-block;
    }
    .refresh-greet-btn {
      background: #FFE4EC;
      border: 1px solid #FFB6C1;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .refresh-greet-btn:active {
      transform: scale(0.85) rotate(45deg);
    }
    .greeting-sub {
      font-size: 12px;
      color: #9C7783;
    }
    .clock-display {
      font-size: 36px;
      font-weight: 900;
      color: #FF6B8B;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      text-shadow: 0 2px 10px rgba(255, 107, 139, 0.2);
    }

    /* 右侧双栏模块通用网格 */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 680px) {
      .grid-container { grid-template-columns: 1fr; }
    }

    /* 番茄钟 */
    .pomo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
    }
    .pomo-timer {
      font-size: 42px;
      font-weight: 900;
      color: #FF5A79;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(255, 90, 121, 0.2);
    }
    .pomo-btns {
      display: flex;
      gap: 10px;
    }
    .pomo-btn {
      padding: 6px 16px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 18px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .pomo-btn.start {
      background: linear-gradient(135deg, #FF7B95 0%, #FF5A79 100%);
      color: white;
      box-shadow: 0 4px 10px rgba(255, 90, 121, 0.3);
    }
    .pomo-btn.reset {
      background: #FFE8ED;
      color: #A36B79;
      border: 1px solid #FFCAD4;
    }

    /* 通用输入行 */
    .input-bar {
      display: flex;
      gap: 8px;
    }
    .text-input {
      flex: 1;
      background: #FFF5F7;
      border: 1.5px solid #FFD6DF;
      border-radius: 10px;
      padding: 7px 10px;
      color: #6D4C57;
      font-size: 12px;
      outline: none;
    }
    .text-input:focus {
      border-color: #FF6B8B;
      background: #FFFFFF;
    }
    .text-input::placeholder { color: #C49DA7; }
    .action-btn {
      background: linear-gradient(135deg, #FF7B95 0%, #FF5A79 100%);
      border: none;
      color: white;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 列表项 */
    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
    }
    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFF8F9;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      border: 1px solid #FFE4E8;
    }
    .list-row.done span {
      text-decoration: line-through;
      color: #BFA5AD;
    }
    .del-btn {
      color: #D89FA9;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .del-btn:hover { color: #FF4757; }

    /* 备忘录文本域 */
    .memo-textarea {
      width: 100%;
      height: 95px;
      background: #FFF5F7;
      border: 1.5px solid #FFD6DF;
      border-radius: 12px;
      padding: 10px;
      color: #6D4C57;
      font-size: 12px;
      outline: none;
      resize: none;
      line-height: 1.5;
    }
    .memo-textarea:focus {
      border-color: #FF6B8B;
      background: #FFFFFF;
    }
    .memo-tip {
      font-size: 11px;
      color: #B58390;
      text-align: right;
    }

    /* 每周复盘网格输入 */
    .review-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 580px) {
      .review-grid { grid-template-columns: 1fr; }
    }
    .review-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .review-label {
      font-size: 11px;
      font-weight: 700;
      color: #9E3E58;
    }
    .review-input {
      background: #FFF5F7;
      border: 1.5px solid #FFD6DF;
      border-radius: 8px;
      padding: 6px 8px;
      color: #6D4C57;
      font-size: 12px;
      outline: none;
    }
    .review-input:focus {
      border-color: #FF6B8B;
      background: #FFFFFF;
    }

    /* 快捷网址 */
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .link-chip {
      background: #FFF2F5;
      border: 1.5px solid #FFD1DC;
      color: #C74D6C;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      transition: 0.2s;
    }
    .link-chip:hover {
      background: #FFE1E8;
      border-color: #FF7B95;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
