<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【帝皇铠甲暴龙金刚兽的工作台】</title>
  <style>
    :root {
      --bg-pink: #FFF0F4;
      --card-bg: rgba(255, 255, 255, 0.96);
      --primary-pink: #FF85A1;
      --deep-pink: #E05A7D;
      --soft-pink: #FFD9E2;
      --text-main: #5C3E48;
      --text-sub: #9E7D88;
      --accent-bow: #FF3B69;
      --border-pink: #FFE2EB;
      --radius-card: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FFF0F4 0%, #FFE6EC 50%, #FFDCE6 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      overflow-x: hidden;
      width: 100vw;
    }

    .sidebar {
      width: 62px;
      min-width: 62px;
      max-width: 62px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.95);
      border-right: 1.5px solid var(--border-pink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      box-shadow: 2px 0 10px rgba(255, 133, 161, 0.12);
    }

    .brand-avatar {
      width: 38px;
      height: 38px;
      background: #FFE8EF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      border: 1.5px solid var(--primary-pink);
      flex-shrink: 0;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      align-items: center;
    }

    .nav-btn {
      width: 50px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-sub);
      gap: 2px;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
      user-select: none;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%) !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 8px rgba(255, 117, 151, 0.35);
    }

    .nav-kitty-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
      pointer-events: none;
    }

    .nav-label {
      font-size: 9px;
      font-weight: 700;
      pointer-events: none;
    }

    .viewport {
      flex: 1;
      padding: 12px 10px 40px;
      max-width: 650px;
      width: calc(100vw - 62px);
      min-width: 0;
      overflow-y: auto;
      height: 100vh;
    }

    .panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    #p-desktop {
      display: flex;
    }
    .panel.active {
      display: flex !important;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      border: 1.5px solid var(--border-pink);
      padding: 14px;
      box-shadow: 0 4px 12px rgba(255, 133, 161, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--deep-pink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hero-header {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF4F7 100%);
      border: 2px solid var(--soft-pink);
      padding: 14px;
    }
    .greeting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .greeting-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--deep-pink);
      line-height: 1.4;
      transition: opacity 0.2s ease;
    }
    .refresh-greet-btn {
      background: #FFE4EC;
      border: 1px solid #FFB6C1;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      flex-shrink: 0;
    }
    .clock-large {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent-bow);
      letter-spacing: -1px;
      line-height: 1.1;
      margin: 4px 0 2px;
      font-variant-numeric: tabular-nums;
    }

    .date-weather-combined {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFF7F9;
      border: 1px solid var(--border-pink);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .weather-part {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--deep-pink);
      font-weight: bold;
    }
    .weather-dropdown {
      background: transparent;
      border: none;
      font-size: 11px;
      color: var(--deep-pink);
      outline: none;
      font-weight: bold;
      cursor: pointer;
    }

    .water-tracker-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-top: 2px;
    }
    .water-cup {
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 8px;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .water-cup.filled {
      background: linear-gradient(135deg, #FFB8C9 0%, #FF85A1 100%);
      border-color: var(--primary-pink);
      box-shadow: 0 2px 6px rgba(255, 133, 161, 0.3);
      transform: translateY(-2px);
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .mood-btn {
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 10px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-sub);
      user-select: none;
    }
    .mood-btn.active {
      background: #FFE8EE;
      border-color: var(--primary-pink);
      color: var(--deep-pink);
      font-weight: bold;
    }

    .quote-card {
      background: #FFF7F9;
      border-left: 4px solid var(--primary-pink);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .quote-zh {
      font-size: 12px;
      font-weight: bold;
      color: var(--deep-pink);
    }
    .quote-en {
      font-size: 10px;
      color: var(--text-sub);
      font-style: italic;
    }

    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .checkin-btn {
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 10px;
      padding: 8px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }
    .checkin-btn.checked {
      background: linear-gradient(135deg, #FFB8C9 0%, #FF85A1 100%);
      border-color: var(--primary-pink);
      color: #FFFFFF;
      font-weight: 800;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .overview-item {
      background: #FFF8FA;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      border: 1px solid var(--border-pink);
    }
    .overview-item .val {
      font-size: 14px;
      font-weight: 800;
      color: var(--deep-pink);
      margin-top: 2px;
    }
    .overview-item .lbl {
      font-size: 10px;
      color: var(--text-sub);
    }

    .pomo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }
    .pomo-timer {
      font-size: 38px;
      font-weight: 900;
      color: var(--deep-pink);
      font-variant-numeric: tabular-nums;
    }
    .pomo-btns {
      display: flex;
      gap: 8px;
    }

      padding: 6px 16px;
      font-size: 11px;
      font-weight
