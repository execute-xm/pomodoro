<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【帝皇铠甲暴龙金刚兽的工作台】</title>
  <style>
    :root {
      --bg-pink: #FFF0F4;
      --card-bg: rgba(255, 255, 255, 0.96);
      --primary-pink: #FF85A1;
      --deep-pink: #E05A7D;
      --soft-pink: #FFD9E2;
      --text-main: #5C3E48;
      --text-sub: #9E7D88;
      --accent-bow: #FF3B69;
      --border-pink: #FFE2EB;
      --radius-card: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FFF0F4 0%, #FFE6EC 50%, #FFDCE6 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      overflow-x: hidden;
      width: 100vw;
    }

    /* 左侧固定侧边栏 */
    .sidebar {
      width: 62px;
      min-width: 62px;
      max-width: 62px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.95);
      border-right: 1.5px solid var(--border-pink);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      box-shadow: 2px 0 10px rgba(255, 133, 161, 0.12);
    }

    .brand-avatar {
      width: 38px;
      height: 38px;
      background: #FFE8EF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      border: 1.5px solid var(--primary-pink);
      flex-shrink: 0;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      align-items: center;
    }

    .nav-btn {
      width: 50px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-sub);
      gap: 2px;
      border: none;
      background: transparent;
      transition: all 0.15s ease;
      user-select: none;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%) !important;
      color: #FFFFFF !important;
      box-shadow: 0 4px 8px rgba(255, 117, 151, 0.35);
    }

    .nav-kitty-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
      pointer-events: none;
    }

    .nav-label {
      font-size: 9px;
      font-weight: 700;
      pointer-events: none;
    }

    /* 右侧主视口 */
    .viewport {
      flex: 1;
      padding: 12px 10px 40px;
      max-width: 650px;
      width: calc(100vw - 62px);
      min-width: 0;
      overflow-y: auto;
      height: 100vh;
    }

    .panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .panel.active {
      display: flex !important;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-card);
      border: 1.5px solid var(--border-pink);
      padding: 14px;
      box-shadow: 0 4px 12px rgba(255, 133, 161, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--deep-pink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hero-header {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF4F7 100%);
      border: 2px solid var(--soft-pink);
      padding: 14px;
    }
    .greeting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .greeting-text {
      font-size: 13px;
      font-weight: 800;
      color: var(--deep-pink);
      line-height: 1.4;
      transition: opacity 0.2s ease;
    }
    .refresh-greet-btn {
      background: #FFE4EC;
      border: 1px solid #FFB6C1;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      flex-shrink: 0;
    }
    .clock-large {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent-bow);
      letter-spacing: -1px;
      line-height: 1.1;
      margin: 4px 0 2px;
      font-variant-numeric: tabular-nums;
    }

    .date-weather-combined {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFF7F9;
      border: 1px solid var(--border-pink);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .weather-part {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--deep-pink);
      font-weight: bold;
    }
    .weather-dropdown {
      background: transparent;
      border: none;
      font-size: 11px;
      color: var(--deep-pink);
      outline: none;
      font-weight: bold;
      cursor: pointer;
    }

    .water-tracker-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-top: 2px;
    }
    .water-cup {
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 8px;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .water-cup.filled {
      background: linear-gradient(135deg, #FFB8C9 0%, #FF85A1 100%);
      border-color: var(--primary-pink);
      box-shadow: 0 2px 6px rgba(255, 133, 161, 0.3);
      transform: translateY(-2px);
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .mood-btn {
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 10px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-sub);
      user-select: none;
    }
    .mood-btn.active {
      background: #FFE8EE;
      border-color: var(--primary-pink);
      color: var(--deep-pink);
      font-weight: bold;
    }

    .quote-card {
      background: #FFF7F9;
      border-left: 4px solid var(--primary-pink);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .quote-zh {
      font-size: 12px;
      font-weight: bold;
      color: var(--deep-pink);
    }
    .quote-en {
      font-size: 10px;
      color: var(--text-sub);
      font-style: italic;
    }

    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .checkin-btn {
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 10px;
      padding: 8px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }
    .checkin-btn.checked {
      background: linear-gradient(135deg, #FFB8C9 0%, #FF85A1 100%);
      border-color: var(--primary-pink);
      color: #FFFFFF;
      font-weight: 800;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .overview-item {
      background: #FFF8FA;
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      border: 1px solid var(--border-pink);
    }
    .overview-item .val {
      font-size: 14px;
      font-weight: 800;
      color: var(--deep-pink);
      margin-top: 2px;
    }
    .overview-item .lbl {
      font-size: 10px;
      color: var(--text-sub);
    }

    .pomo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }
    .pomo-timer {
      font-size: 38px;
      font-weight: 900;
      color: var(--deep-pink);
      font-variant-numeric: tabular-nums;
    }
    .pomo-btns {
      display: flex;
      gap: 8px;
    }
    .pomo-btn {
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 18px;
      border: none;
      cursor: pointer;
    }
    .pomo-btn.start {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%);
      color: white;
    }
    .pomo-btn.reset {
      background: #FFE8EE;
      color: var(--text-sub);
    }

    .prompt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .prompt-chip {
      background: #FFF8FA;
      border: 1px solid var(--border-pink);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
    }
    .prompt-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--deep-pink);
    }
    .prompt-desc {
      font-size: 9px;
      color: var(--text-sub);
    }

    .wish-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .wish-item {
      background: #FFF9FB;
      border: 1px solid var(--border-pink);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .wish-bar-bg {
      height: 6px;
      background: #FFE8EE;
      border-radius: 3px;
      overflow: hidden;
    }
    .wish-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #FFA3BA, #FF6086);
      border-radius: 3px;
      transition: width 0.3s;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .form-row {
      display: flex;
      gap: 5px;
    }
    .custom-input, select, textarea {
      width: 100%;
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 9px;
      padding: 7px 8px;
      font-size: 11px;
      color: var(--text-main);
      outline: none;
    }
    .primary-btn {
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%);
      border: none;
      color: #FFFFFF;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .stream-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 240px;
      overflow-y: auto;
    }
    .stream-item {
      background: #FFF9FB;
      border: 1.5px solid var(--border-pink);
      border-radius: 9px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
    }
    .stream-item.is-done span {
      text-decoration: line-through;
      color: #C2A5AE;
    }
    .delete-action {
      color: #E29CA9;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      padding: 2px 4px;
    }

    .priority-tag {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 5px;
      font-weight: bold;
    }
    .p-high { background: #FFE0E6; color: #E0355A; }
    .p-mid { background: #FFF0D6; color: #D47B00; }
    .p-low { background: #E8F5E9; color: #2E7D32; }

    .study-cat-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: bold;
    }
    .cat-en { background: #E3F2FD; color: #1976D2; }
    .cat-ai { background: #EDE7F6; color: #5E35B1; }
    .cat-copy { background: #FCE4EC; color: #C2185B; }

    .food-img-thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-pink);
    }

    .tab-switch {
      display: flex;
      background: #FFE8EE;
      border-radius: 9px;
      padding: 2px;
      gap: 3px;
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 5px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 7px;
      cursor: pointer;
      color: var(--text-sub);
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: var(--deep-pink);
    }
    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #FFF8FA;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border-pink);
    }
    .chart-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chart-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
    }
    .chart-bar-bg {
      height: 6px;
      background: #FFE8EE;
      border-radius: 3px;
      overflow: hidden;
    }
    .chart-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #FFA3BA, #FF6086);
      border-radius: 3px;
    }

    .review-textarea {
      width: 100%;
      height: 120px;
      background: #FFF8FA;
      border: 1.5px solid var(--border-pink);
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
      color: var(--text-main);
      outline: none;
      resize: vertical;
      line-height: 1.6;
    }

    .photo-upload-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1.5px dashed var(--soft-pink);
      padding: 8px 10px;
      border-radius: 10px;
      background: #FFFBFD;
    }
    .review-photo-preview {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      display: none;
    }

    .muyu-float-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #FFA3BA 0%, #FF7597 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 14px rgba(255, 117, 151, 0.4);
      cursor: pointer;
      z-index: 999;
      user-select: none;
    }
    .muyu-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .muyu-box {
      width: 280px;
      background: #FFFFFF;
      border-radius: 20px;
      border: 2px solid var(--border-pink);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .muyu-drum {
      width: 90px;
      height: 90px;
      background: #FFF0F4;
      border: 2px solid var(--primary-pink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      cursor: pointer;
      user-select: none;
    }
    .muyu-toast {
      position: absolute;
      top: 50px;
      color: var(--accent-bow);
      font-weight: 800;
      font-size: 14px;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
  </style>
</head>
